<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open HL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0b10;--surface:#12121a;--surface2:#17171f;--border:#23232f;--accent:#6d28d9;--text:#eaeaf2;--muted:#7a7a92;--red:#fb7185}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,Roboto,sans-serif;padding:32px 16px;
  background-image:linear-gradient(rgba(109,40,217,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(109,40,217,.05) 1px,transparent 1px);background-size:44px 44px}
.card{max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 20px 22px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.brand img{width:44px;height:44px;border-radius:12px}
.name{font-weight:800;font-size:20px}.tag{font-size:11px;color:var(--muted);font-family:monospace}
h1{font-size:20px;font-weight:800;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:18px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-family:monospace}
input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:13px;color:var(--text);font-size:16px;font-family:monospace;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,40,217,.18)}
button{border-radius:10px;font-size:15px;font-weight:600;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.go{width:100%;margin-top:10px;padding:13px;background:linear-gradient(135deg,var(--accent),#7c3aed);border:none;color:#fff}
.notice{border:1px solid rgba(251,113,133,.4);background:rgba(251,113,133,.08);color:#fecdd3;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px;line-height:1.5;word-break:break-word}
.section-t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px;font-family:monospace}
.srv{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);margin-bottom:8px}
.srv .u{flex:1;min-width:0;padding:13px 12px;font-family:monospace;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;text-align:left}
.srv .x{background:none;border:none;color:var(--muted);padding:10px 14px;font-size:18px}
</style>
</head><body>
<main class="card">
  <div class="brand"><img src="icon.png" alt=""><div><div class="name">Open HL</div><div class="tag">android</div></div></div>
  <h1>Connect to your Open HL server</h1>
  <p class="sub">The address you use in the browser: a LAN IP, a Tailscale address, or a domain.</p>
  <div id="notice" class="notice" hidden></div>
  <form id="form" autocomplete="off">
    <label for="url">Server address</label>
    <input id="url" type="url" inputmode="url" placeholder="http://100.x.y.z:3000" spellcheck="false" autocapitalize="off">
    <button class="go" type="submit">Connect</button>
  </form>
  <section id="saved-wrap" hidden>
    <div class="section-t">Recent servers</div>
    <div id="saved"></div>
  </section>
</main>
<script>
(function () {
  var A = window.OpenHLConnect;
  var q = new URLSearchParams(location.search);
  var notice = document.getElementById("notice");
  if (q.get("error")) { notice.textContent = q.get("error"); notice.hidden = false; }
  var input = document.getElementById("url");
  function render() {
    var list = [];
    try { list = JSON.parse(A.servers()); } catch (e) {}
    var box = document.getElementById("saved");
    box.textContent = "";
    document.getElementById("saved-wrap").hidden = !list.length;
    if (!input.value && list[0]) input.value = list[0];
    list.forEach(function (u) {
      var row = document.createElement("div"); row.className = "srv";
      var b = document.createElement("button"); b.className = "u"; b.type = "button"; b.textContent = u;
      b.onclick = function () { A.connect(u); };
      var x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "×";
      x.setAttribute("aria-label", "Forget " + u);
      x.onclick = function () { A.forget(u); if (input.value === u) input.value = ""; render(); };
      row.appendChild(b); row.appendChild(x); box.appendChild(row);
    });
  }
  document.getElementById("form").onsubmit = function (e) {
    e.preventDefault();
    var err = A.connect(input.value);
    if (err) { notice.textContent = err; notice.hidden = false; }
  };
  render();
})();
</script>
</body></html>
